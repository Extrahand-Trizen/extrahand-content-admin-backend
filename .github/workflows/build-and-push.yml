name: Build and Push Content Admin Backend

on:
  push:
    branches:
      - Ajay
      - main
      - feat/add-new-user
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: extrahand
  K8S_DEPLOYMENT: content-admin-backend
  K8S_CONTAINER: content-admin-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.downcase.outputs.image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase image name
        id: downcase
        run: |
          name="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=${name}" >> "$GITHUB_ENV"
          echo "image_name=${name}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || {
              echo "::warning::package-lock.json out of sync — falling back to npm install"
              rm -rf node_modules
              npm install
            }
          else
            echo "::warning::package-lock.json missing — using npm install"
            npm install
          fi

      - name: Build TypeScript
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After image is on GHCR, roll the k3s Deployment so pods pull the new image.
  # Uses SSH into the k3s node (safer than exposing the API server to the internet).
  #
  # Required repo Secrets (Settings → Secrets and variables → Actions):
  #   K3S_SSH_HOST — e.g. 72.62.192.249
  #   K3S_SSH_USER — e.g. root
  #   K3S_SSH_KEY  — private key that can SSH to that host
  deploy-k3s:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only promote Ajay/main (and manual runs) to the live cluster — not every feature branch.
    if: >
      github.ref == 'refs/heads/Ajay' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy image to k3s
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.K3S_SSH_HOST }}
          username: ${{ secrets.K3S_SSH_USER }}
          key: ${{ secrets.K3S_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export KUBECONFIG="$HOME/.kube/config"

            IMAGE="${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name }}:sha-${{ github.sha }}"
            echo "Rolling out ${IMAGE}"

            kubectl set image "deployment/${{ env.K8S_DEPLOYMENT }}" \
              "${{ env.K8S_CONTAINER }}=${IMAGE}" \
              -n "${{ env.K8S_NAMESPACE }}"

            kubectl rollout status "deployment/${{ env.K8S_DEPLOYMENT }}" \
              -n "${{ env.K8S_NAMESPACE }}" \
              --timeout=180s

            kubectl get pods -n "${{ env.K8S_NAMESPACE }}" -l "app=${{ env.K8S_DEPLOYMENT }}" -o wide
